name: Push actions

on:
  push:
    branches:
      - master
      - dev

jobs:
  validate:
    runs-on: "ubuntu-latest"
    name: Validate
    steps:
        - uses: "actions/checkout@v2"

        - name: HACS validation
          uses: "hacs/action@main"
          with:
            category: "integration"

        - name: Hassfest validation
          uses: "home-assistant/actions/hassfest@master"

  style:
    runs-on: "ubuntu-latest"
    name: Check style formatting
    steps:
        - uses: "actions/checkout@v2"
        - uses: "actions/setup-python@v1"
          with:
            python-version: "3.x"
        - run: python3 -m pip install black
        - run: black .

  tests:
    runs-on: "ubuntu-latest"
    name: Run tests (HA ${{ matrix.ha }})
    strategy:
      matrix:
        include:
          - ha: "2025.1"
            python: "3.13"
            requirements: "-r requirements_test.txt"
          - ha: "2026.11.1"
            python: "3.14"
            requirements: "homeassistant==2026.11.1 pytest pytest-asyncio pytest-cov pytest-timeout pytest-xdist"
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@v2"
      - name: Setup Python
        uses: "actions/setup-python@v5"
        with:
          python-version: ${{ matrix.python }}
      - name: Install requirements
        run: python3 -m pip install ${{ matrix.requirements }}
      - name: Run tests
        run: |
          pytest \
            -qq \
            --timeout=9 \
            --durations=10 \
            -n auto \
            --cov custom_components.netgear_wax \
            -o console_output_style=count \
            -p no:sugar \
            tests
